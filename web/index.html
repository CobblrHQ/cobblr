<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: lets env(safe-area-inset-*) resolve on notched
         phones (standalone PWA is full-bleed regardless; the app shell pads
         its chrome with the insets — see AppLayout's header). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3D4451" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS "Add to Home Screen": force the app name (else iOS uses the dynamic
         page <title> = "Dashboard – cobblr") + run standalone. -->
    <meta name="apple-mobile-web-app-title" content="Cobblr" />
    <meta name="application-name" content="Cobblr" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent + the header's safe-area padding = the app paints
         behind the status bar but its chrome starts below it. "default" was a
         lie on notched phones: iOS full-bled the webview anyway and the
         workspace name rendered under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cobblr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Staging/dev get a PURPLE app icon + manifest + tab so the PWA and the
         browser tab are unmistakably NOT public prod (Grace: tell staging apart
         from cobblr.me at a glance). Prod = cobblr.me + its subdomains; every
         other host (the staging .ts.net URL, localhost) flips to the purple set. -->
    <script>
      (function () {
        try {
          if (/(^|\.)cobblr\.me$/i.test(location.hostname)) return;
          var set = function (sel, attr, val) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute(attr, val);
          };
          set('meta[name="theme-color"]', "content", "#6D28D9");
          set('link[rel="icon"]', "href", "/favicon-staging.svg");
          set('link[rel="apple-touch-icon"]', "href", "/apple-touch-icon-staging.png");
          set('link[rel="manifest"]', "href", "/manifest-staging.webmanifest");
          set('meta[name="apple-mobile-web-app-title"]', "content", "Cobblr · staging");
          set('meta[name="application-name"]', "content", "Cobblr · staging");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
