<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: lets env(safe-area-inset-*) resolve on notched
         phones (standalone PWA is full-bleed regardless; the app shell pads
         its chrome with the insets — see AppLayout's header). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3D4451" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS "Add to Home Screen": force the app name (else iOS uses the dynamic
         page <title> = "Dashboard – cobblr") + run standalone. -->
    <meta name="apple-mobile-web-app-title" content="Cobblr" />
    <meta name="application-name" content="Cobblr" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent + the header's safe-area padding = the app paints
         behind the status bar but its chrome starts below it. "default" was a
         lie on notched phones: iOS full-bled the webview anyway and the
         workspace name rendered under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Cobblr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Per-environment app icon + manifest + tab title, so the PWA and the
         browser tab are unmistakably NOT public prod (Grace: tell staging apart
         from cobblr.me at a glance).

           canary.cobblr.me  → YELLOW-DOT set (stock mark + a yellow dot)
           any *.cobblr.me   → prod set (the default markup below)
           anything else     → PURPLE staging set (the .ts.net URL, localhost)

         ORDER MATTERS. Canary is checked BEFORE the cobblr.me bail-out: canary
         is a cobblr.me subdomain, so a plain "is it cobblr.me?" test hands it the
         PRODUCTION icon — which is the precise confusion this block exists to
         prevent. `lint:env-icons` fails if a variant loses its branch here.

         Canary keeps the stock mark rather than recolouring it like staging,
         because canary runs REAL production data and should still read as
         Cobblr; the dot says "newer code", not "different app". -->
    <script>
      (function () {
        try {
          var set = function (sel, attr, val) {
            var el = document.querySelector(sel);
            if (el) el.setAttribute(attr, val);
          };
          if (/^canary\./i.test(location.hostname)) {
            set('meta[name="theme-color"]', "content", "#FACC15");
            set('link[rel="icon"]', "href", "/favicon-canary.svg");
            set('link[rel="apple-touch-icon"]', "href", "/apple-touch-icon-canary.png");
            set('link[rel="manifest"]', "href", "/manifest-canary.webmanifest");
            set('meta[name="apple-mobile-web-app-title"]', "content", "Cobblr · canary");
            set('meta[name="application-name"]', "content", "Cobblr · canary");
            return;
          }
          if (/(^|\.)cobblr\.me$/i.test(location.hostname)) return;
          set('meta[name="theme-color"]', "content", "#6D28D9");
          set('link[rel="icon"]', "href", "/favicon-staging.svg");
          set('link[rel="apple-touch-icon"]', "href", "/apple-touch-icon-staging.png");
          set('link[rel="manifest"]', "href", "/manifest-staging.webmanifest");
          set('meta[name="apple-mobile-web-app-title"]', "content", "Cobblr · staging");
          set('meta[name="application-name"]', "content", "Cobblr · staging");
        } catch (e) {}
      })();
    </script>
    <!-- Running inside the Cobblr desktop app?
         The app extends its webview under the macOS title bar so the page's own
         colours reach the top edge, which means the window controls float over
         the top-left corner. Only the SIDEBAR has to get out of their way; the
         content column is happier full-bleed.
         Set before first paint, so the layout is never briefly wrong. A normal
         browser never matches the UA, so this is inert on the web. -->
    <script>
      (function () {
        try {
          if (/CobblrDesktop\//.test(navigator.userAgent)) {
            document.documentElement.classList.add("desktop-app");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
