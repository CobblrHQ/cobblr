<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="cobblr canary">
  <!-- Canary favicon — the STOCK mark plus a yellow dot, so canary.cobblr.me is
       unmistakable in a tab strip without becoming a different logo. Staging
       recolours the whole mark; canary deliberately does not, because canary IS
       production data and should still read as Cobblr. See index.html host gate. -->
  <polygon points="8,12 38,8 44,38 30,46 10,40" fill="#3D4451"/>
  <polygon points="52,10 88,16 92,40 70,46 50,32" fill="#8B7355"/>
  <polygon points="10,52 32,50 36,82 18,90 6,76" fill="#6B8E4E"/>
  <polygon points="46,56 78,52 92,72 84,90 54,86" fill="#A48663"/>
  <circle cx="49" cy="49" r="19" fill="#FACC15"/>
</svg>
