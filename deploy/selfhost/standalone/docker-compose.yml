# Cobblr self-host — the standalone, image-based stack. Two files: this and
# the .env beside it. No repo clone, no build step; docs:
# https://docs.cobblr.xyz/self-hosting
#
# NOTE: inert until the public GHCR images publish (multi-arch amd64+arm64).
# Until then, self-hosting uses the clone-and-build path one directory up.
#
# HTTPS is a compose PROFILE: COMPOSE_PROFILES=caddy (default, set in .env)
# runs the bundled TLS proxy; empty runs bare, for `tailscale serve/funnel`
# on the host. All data lives in bind mounts under ${COBBLR_DATA_ROOT:-./data}/ —
# set COBBLR_DATA_ROOT in .env to relocate every mount at once (e.g. onto a NAS
# or a data disk). Deliberately NO named
# volumes.

services:
  db:
    image: ghcr.io/cobblrhq/cobblr-db:${COBBLR_VERSION:-latest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cobblr_meta}
    volumes:
      # One level up: PG18+ stores the cluster in a versioned subdirectory,
      # and the image upgrades an older one in place on boot, so a plain
      # `docker compose pull` carries you across major versions.
      - ${COBBLR_DATA_ROOT:-./data}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobblr} -d ${POSTGRES_DB:-cobblr_meta}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: ghcr.io/cobblrhq/cobblr-api:${COBBLR_VERSION:-latest}
    env_file: .env # the whole config surface (secrets, email, privacy, …)
    environment:
      NODE_ENV: production
      # Derived from POSTGRES_* so the password lives in exactly ONE line of
      # .env. Using an external Postgres? Set DATABASE_URL /
      # SUPERUSER_DATABASE_URL in .env and they win over the derived values.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-cobblr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cobblr_meta}}
      SUPERUSER_DATABASE_URL: ${SUPERUSER_DATABASE_URL:-postgres://${POSTGRES_USER:-cobblr}:${POSTGRES_PASSWORD}@db:5432/postgres}
      # Uploaded files + runtime-installed modules MUST land on the bind
      # mounts below — without these env vars the app writes to its defaults
      # inside the container's writable layer, and every `compose pull && up`
      # (the documented update) silently discards them. The mount target and
      # the env value must stay in lockstep; scripts/lint-selfhost-mounts.ts
      # enforces it in CI.
      COBBLR_FILES_ROOT: /var/cobblr/files
      COBBLR_RUNTIME_MODULES_DIR: /var/cobblr/sandboxed-modules
      # The tag this stack runs, passed through so /healthz and Health can
      # report it. Runtime-only on purpose: a stable cut re-tags a nightly
      # digest bit-for-bit, so a version can never be baked into the image.
      COBBLR_VERSION: ${COBBLR_VERSION:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${COBBLR_DATA_ROOT:-./data}/files:/var/cobblr/files
      - ${COBBLR_DATA_ROOT:-./data}/modules:/var/cobblr/sandboxed-modules
    restart: unless-stopped


  # ─── Nightly database dumps ──────────────────────────────────────────
  # Copying the data tree is NOT a complete backup on its own: a Postgres data
  # directory copied while the server is running is a torn snapshot that may not
  # restore. This writes a real pg_dumpall every day, which restores anywhere.
  #
  # A dump that "succeeded" at 20 bytes is what hid a three-day outage on the
  # hosted instance, so a run only counts as usable if it clears BACKUP_MIN_BYTES,
  # and retention counts only usable dumps — otherwise a bad week quietly evicts
  # the good backups underneath it.
  backup:
    image: ghcr.io/cobblrhq/cobblr-db:${COBBLR_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-cobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-cobblr_meta}
      BACKUP_DAILY_RETENTION: ${BACKUP_DAILY_RETENTION:-30}
      BACKUP_WEEKLY_RETENTION: ${BACKUP_WEEKLY_RETENTION:-12}
      # MUST be listed here: the entrypoint reads ${BACKUP_MIN_BYTES:-...} and a
      # value in .env reaches this container only if compose passes it.
      BACKUP_MIN_BYTES: ${BACKUP_MIN_BYTES:-10000}
    volumes:
      - ${COBBLR_DATA_ROOT:-./data}/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -euo pipefail
        mkdir -p /backups/daily /backups/weekly
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          OUT="/backups/daily/cobblr-$$STAMP.sql.gz"
          echo "[backup] $$STAMP -> pg_dumpall -> $$OUT"
          ok=1
          pg_dumpall --clean --if-exists | gzip > "$$OUT" || ok=0
          SZ=$$(stat -c%s "$$OUT" 2>/dev/null || echo 0)
          if [ "$$ok" = "1" ] && [ "$$SZ" -ge "$${BACKUP_MIN_BYTES:-100000}" ]; then
            echo "[backup] $$STAMP done — $$SZ bytes"
            [ "$$(date +%u)" = "7" ] && cp "$$OUT" /backups/weekly/ && echo "[backup] weekly copy"
            SLEEP=86400
          else
            echo "[backup] $$STAMP FAILED — $$SZ bytes; kept for triage, retrying within the hour"
            SLEEP=3600
          fi
          # Retention counts only USABLE dumps: letting 20-byte failures occupy slots
          # means a bad week quietly evicts the good backups underneath them.
          find /backups/daily -name '*.sql.gz' -size -$$(( $${BACKUP_MIN_BYTES:-100000} / 1024 ))k -mmin +2880 -delete 2>/dev/null || true
          # `|| true` is load-bearing: a `while` returns its LAST test's status, so a
          # final undersized file would make the pipeline non-zero and set -e would
          # kill the container.
          { ls -1t /backups/daily/*.sql.gz 2>/dev/null \
            | while read -r f; do [ "$$(stat -c%s "$$f")" -ge "$${BACKUP_MIN_BYTES:-100000}" ] && echo "$$f"; done \
            | tail -n +$$((BACKUP_DAILY_RETENTION + 1)) | xargs -r rm -f; } || true
          { ls -1t /backups/weekly/*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_WEEKLY_RETENTION + 1)) | xargs -r rm -f; } || true
          sleep $$SLEEP
        done

  web:
    image: ghcr.io/cobblrhq/cobblr-web:${COBBLR_VERSION:-latest}
    depends_on:
      - api
    # Loopback ALWAYS, never on the LAN. Caddy proxies over the compose
    # network; tailscale serve/funnel forwards to 127.0.0.1 on the host; and
    # localhost stays available for on-box debugging in every mode. WEB_BIND
    # exists as an escape hatch; think twice before widening it.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    restart: unless-stopped

  caddy:
    image: ghcr.io/cobblrhq/cobblr-caddy:${COBBLR_VERSION:-latest}
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The four TLS variants are baked into the image; pick one:
      COBBLR_TLS_MODE: ${COBBLR_TLS_MODE:-duckdns} # duckdns | cloudflare | internal | tsnet
      # tsnet mode only: a reusable auth key; the proxy joins the tailnet itself.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      COBBLR_SITE_ADDRESS: ${COBBLR_SITE_ADDRESS:?set COBBLR_SITE_ADDRESS in .env}
      COBBLR_ACME_EMAIL: ${COBBLR_ACME_EMAIL:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      # certs + CA state survive restarts (never re-request on boot)
      - ${COBBLR_DATA_ROOT:-./data}/caddy:/data
      - ${COBBLR_DATA_ROOT:-./data}/caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
