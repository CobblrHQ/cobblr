# Cobblr self-host — the standalone, image-based stack. Two files: this and
# the .env beside it. No repo clone, no build step; docs:
# https://docs.cobblr.xyz/self-hosting
#
# NOTE: inert until the public GHCR images publish (multi-arch amd64+arm64).
# Until then, self-hosting uses the clone-and-build path one directory up.
#
# HTTPS is a compose PROFILE: COMPOSE_PROFILES=caddy (default, set in .env)
# runs the bundled TLS proxy; empty runs bare, for `tailscale serve/funnel`
# on the host. Daily auto-update is a second profile, off by default:
# COMPOSE_PROFILES=caddy,autoupdate runs the updater at the bottom. All data lives in bind mounts under ${COBBLR_DATA_ROOT:-./data}/ —
# set COBBLR_DATA_ROOT in .env to relocate every mount at once (e.g. onto a NAS
# or a data disk). Deliberately NO named
# volumes.

services:
  db:
    # Room for Postgres's dynamic shared memory (/dev/shm). Docker's default is
    # 64 MB, and a server holding many workspace databases outgrows it: the
    # cumulative statistics live there (about 100 KB per workspace database,
    # measured at 605 databases filling 61 MB), and so does every parallel
    # query's hash table (work_mem 4 MB x hash_mem_multiplier 2 x 3 processes,
    # grown in 32 MB segments, up to four at once with max_parallel_workers 8).
    # When it ran out, new workspaces failed to provision at signup and stayed
    # dead, and ordinary queries failed with "could not resize shared memory
    # segment". 1 GB covers several thousand workspaces plus the parallel
    # peak; it is a ceiling, not an allocation.
    shm_size: "1gb"
    image: ghcr.io/cobblrhq/cobblr-db:${COBBLR_VERSION:-latest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cobblr_meta}
    volumes:
      # One level up: PG18+ stores the cluster in a versioned subdirectory,
      # and the image upgrades an older one in place on boot, so a plain
      # `docker compose pull` carries you across major versions.
      - ${COBBLR_DATA_ROOT:-./data}/db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobblr} -d ${POSTGRES_DB:-cobblr_meta}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    labels:
      # The nightly updater (the autoupdate profile) touches only containers
      # carrying this label, so other stacks on the same box are left alone.
      com.centurylinklabs.watchtower.enable: "true"

  api:
    ports:
      - "127.0.0.1:${COBBLR_BRIDGE_API_PORT:-14000}:4000"
    image: ghcr.io/cobblrhq/cobblr-api:${COBBLR_VERSION:-latest}
    env_file: .env # the whole config surface (secrets, email, privacy, …)
    environment:
      NODE_ENV: production
      # Derived from POSTGRES_* so the password lives in exactly ONE line of
      # .env. Using an external Postgres? Set DATABASE_URL /
      # SUPERUSER_DATABASE_URL in .env and they win over the derived values.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-cobblr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cobblr_meta}}
      SUPERUSER_DATABASE_URL: ${SUPERUSER_DATABASE_URL:-postgres://${POSTGRES_USER:-cobblr}:${POSTGRES_PASSWORD}@db:5432/postgres}
      # Uploaded files + runtime-installed modules MUST land on the bind
      # mounts below — without these env vars the app writes to its defaults
      # inside the container's writable layer, and every `compose pull && up`
      # (the documented update) silently discards them. The mount target and
      # the env value must stay in lockstep; scripts/lint-selfhost-mounts.ts
      # enforces it in CI.
      COBBLR_FILES_ROOT: /var/cobblr/files
      COBBLR_RUNTIME_MODULES_DIR: /var/cobblr/sandboxed-modules
      # The tag this stack runs, passed through so /healthz and Health can
      # report it. Runtime-only on purpose: a stable cut re-tags a nightly
      # digest bit-for-bit, so a version can never be baked into the image.
      COBBLR_VERSION: ${COBBLR_VERSION:-}
      # Keep each order's lines' tracking current from the store's own order
      # page (a Shopify "View order" link in the order email). A self-hosted
      # instance reads from its own address, so it is on here; false keeps the
      # links and reads none.
      COBBLR_ORDER_PAGE_READS: ${COBBLR_ORDER_PAGE_READS:-true}
      COBBLR_SERVER_BRIDGE_ENABLED: ${COBBLR_SERVER_BRIDGE_ENABLED:-false}
      COBBLR_SERVER_BRIDGE_DIR: /var/cobblr/server-bridge/workspaces
      COBBLR_SERVER_BRIDGE_ORIGIN: http://127.0.0.1:${COBBLR_BRIDGE_API_PORT:-14000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${COBBLR_DATA_ROOT:-./data}/files:/var/cobblr/files
      - ${COBBLR_DATA_ROOT:-./data}/modules:/var/cobblr/sandboxed-modules
      - ${COBBLR_DATA_ROOT:-./data}/server-bridge/workspaces:/var/cobblr/server-bridge/workspaces
    # So `web` waits for the api to actually SERVE, not merely to start: without
    # it, during a long first-boot migration the web fronts the api and returns
    # 502s with no signal (audit L-APINEALTH). node's global fetch is always
    # present in the api image, so no curl/wget dependency. start_period covers
    # the first-boot migration run before failures count.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"


  bridge:
    profiles: [bridge]
    image: ghcr.io/cobblrhq/cobblr-api:${COBBLR_VERSION:-latest}
    command: [node, dist/bin/server-bridge.js]
    # LAN multicast and broadcast discovery need the host network.
    network_mode: host
    environment:
      COBBLR_HOSTED: ${COBBLR_HOSTED:-false}
      COBBLR_SERVER_BRIDGE_ENABLED: ${COBBLR_SERVER_BRIDGE_ENABLED:-false}
      COBBLR_SERVER_BRIDGE_DIR: /var/cobblr/server-bridge/workspaces
      COBBLR_SERVER_BRIDGE_CACHE_DIR: /var/cobblr/server-bridge/cache
    volumes:
      - ${COBBLR_DATA_ROOT:-./data}/server-bridge/workspaces:/var/cobblr/server-bridge/workspaces:ro
      - ${COBBLR_DATA_ROOT:-./data}/server-bridge/cache:/var/cobblr/server-bridge/cache
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ─── Nightly database dumps ──────────────────────────────────────────
  # Copying the data tree is NOT a complete backup on its own: a Postgres data
  # directory copied while the server is running is a torn snapshot that may not
  # restore. This writes a real pg_dumpall every day, which restores anywhere.
  #
  # A dump that "succeeds" at 20 bytes is worse than no dump at all — it reads
  # as covered until the restore. So a run only counts if it clears BACKUP_MIN_BYTES,
  # and retention counts only usable dumps — otherwise a bad week quietly evicts
  # the good backups underneath it.
  backup:
    image: ghcr.io/cobblrhq/cobblr-db:${COBBLR_VERSION:-latest}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-cobblr}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-cobblr_meta}
      BACKUP_DAILY_RETENTION: ${BACKUP_DAILY_RETENTION:-30}
      BACKUP_WEEKLY_RETENTION: ${BACKUP_WEEKLY_RETENTION:-12}
      # MUST be listed here: the entrypoint reads ${BACKUP_MIN_BYTES:-...} and a
      # value in .env reaches this container only if compose passes it.
      BACKUP_MIN_BYTES: ${BACKUP_MIN_BYTES:-10000}
      # The hour the dump happens, in this machine's local time. It used to be
      # "24 h after this container last started", so it drifted with every
      # `compose pull` and nobody could say when their backup ran (#3307). Set
      # it to a quiet hour for your box; BACKUP_AT=interval keeps the old
      # behaviour. A completed dump touches data/backups/last-dump, so your own
      # off-box copy (rsync, restic, a cloud sync) can run after it instead of
      # guessing.
      BACKUP_AT: ${BACKUP_AT:-03:00}
      # The zone BACKUP_AT is read in. The container's own clock is UTC, so
      # without this 03:00 means 03:00 UTC. Set BACKUP_TZ (or TZ) in .env to
      # the zone your off-box copy runs in, e.g. Europe/Berlin.
      BACKUP_TZ: ${BACKUP_TZ:-${TZ:-}}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-cobblr}
    volumes:
      - ${COBBLR_DATA_ROOT:-./data}/backups:/backups
    # The loop lives in the image (docker/backup-loop.sh in core, tested by
    # scripts/backup-loop.test.ts) rather than inline here: it existed in four
    # compose files, and the copy nobody read still called a refused connection
    # a successful backup.
    entrypoint: ["/usr/local/bin/backup-loop.sh"]

  web:
    image: ghcr.io/cobblrhq/cobblr-web:${COBBLR_VERSION:-latest}
    depends_on:
      api:
        condition: service_healthy
    # Loopback ALWAYS, never on the LAN. Caddy proxies over the compose
    # network; tailscale serve/funnel forwards to 127.0.0.1 on the host; and
    # localhost stays available for on-box debugging in every mode. WEB_BIND
    # exists as an escape hatch; think twice before widening it.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  caddy:
    image: ghcr.io/cobblrhq/cobblr-caddy:${COBBLR_VERSION:-latest}
    profiles: ["caddy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The four TLS variants are baked into the image; pick one:
      COBBLR_TLS_MODE: ${COBBLR_TLS_MODE:-internal} # cloudflare | internal | tsnet | duckdns (legacy)
      # tsnet mode only: a reusable auth key; the proxy joins the tailnet itself.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      COBBLR_SITE_ADDRESS: ${COBBLR_SITE_ADDRESS:?set COBBLR_SITE_ADDRESS in .env}
      COBBLR_ACME_EMAIL: ${COBBLR_ACME_EMAIL:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      # certs + CA state survive restarts (never re-request on boot)
      - ${COBBLR_DATA_ROOT:-./data}/caddy:/data
      - ${COBBLR_DATA_ROOT:-./data}/caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ─── Daily auto-update (opt in) ───────────────────────────────────────
  # COMPOSE_PROFILES=caddy,autoupdate in .env turns this on. Once a day it
  # pulls newer images for the labelled services above and recreates only the
  # ones that changed: the same thing as `docker compose pull && docker
  # compose up -d`, run for you. Restart order is not promised (the updater
  # knows container names, not compose services), and does not need to be:
  # every service has a restart policy, and the api will not serve until the
  # database answers and its migrations have applied. Pairs with
  # COBBLR_VERSION=nightly. It needs the Docker socket, which is host-level
  # access, so it is a profile you choose rather than part of the default stack.
  # The selfhost boot test boots this profile and fails if the updater does not
  # reach the point of scheduling its first run.
  watchtower:
    # The maintained fork, pinned. The original containrrr image is unmaintained and
    # asks the daemon for API 1.25, which every engine since Docker v25 refuses; the
    # template used to carry a DOCKER_API_VERSION override for that. The fork tracks
    # current Docker, takes the same WATCHTOWER_* settings, and needs no override.
    image: ghcr.io/nicholas-fedor/watchtower:1.17.0
    profiles: ["autoupdate"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Every four hours, UTC, rather than at one hour of one clock. Any fixed
      # hour is only ever right for one part of the world: a box whose local
      # morning falls before the day's build has been published would check just
      # too early and sit a day behind, every day. Checking on a plain interval
      # asks no questions about anyone's timezone and cannot go stale that way.
      #
      # It costs nothing in restarts. There is about one new build a day, so
      # five of the six checks find nothing and change nothing; a check that
      # finds no new image does not touch a container. Zulu, so the log
      # timestamps and this expression agree, and no daylight-saving rule can
      # move it.
      #
      # Six fields, seconds first. Set WATCHTOWER_SCHEDULE to a fixed hour if you
      # would rather choose the moment, and WATCHTOWER_TZ to read it in your zone.
      TZ: ${WATCHTOWER_TZ:-UTC}
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 */4 * * *}
      # Only containers with the enable label above; never another stack.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Drop the superseded image after a successful update.
      WATCHTOWER_CLEANUP: "true"
      # A container mid-restart (the api during its migration boot) still counts.
      WATCHTOWER_INCLUDE_RESTARTING: "true"
