server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — keep this above the SPA fallback so /api/* never
    # falls through to index.html.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API can stream; don't buffer if we ever return SSE.
        proxy_buffering off;
    }

    # SPA fallback — every other path resolves to index.html so client
    # routing handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets; HTML stays fresh so deploys flip
    # in cleanly.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
