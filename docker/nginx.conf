# Honor the upstream proxy's scheme. Cloudflare Tunnel (and the tailnet Caddy)
# terminate HTTPS and forward X-Forwarded-Proto: https, but cloudflared→nginx is
# itself plain http — so a bare $scheme would say "http" and make server-built
# absolute links (invite + magic-link emails via req.protocol) emit http://.
# Pass the original through when present; fall back to $scheme for direct hits.
map $http_x_forwarded_proto $cobblr_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Content-Security-Policy, in two headers, defined ONCE here and referenced in
# every block below (add_header does not inherit into a location with its own
# add_header, so the value must be referenced, not re-typed, or the copies drift).
#
# ENFORCED: only the directives that cannot break a normally-loading SPA —
# clickjacking (frame-ancestors), <base> injection, plugins, and off-site form
# posts. These restrict nothing the app legitimately does, so they are safe to
# turn on blind. (X-Frame-Options SAMEORIGIN stays for old browsers, and
# frame-ancestors says the SAME thing: 'self'. 'none' would refuse the app's own
# same-origin frames — label previews, the guided-tour phone stage — as a black
# chrome-error:// page; lint:csp-frame-ancestors keeps the two headers agreeing.)
#
# REPORT-ONLY: the full policy that would actually blunt an XSS token-exfil —
# script-src 'self', connect-src 'self', etc. It is Report-Only because it CANNOT
# be verified without a browser against the real build (Vite may emit an inline
# bootstrap script; the sandboxed-app srcdoc iframes; data:/blob: images), and a
# wrong script-src white-screens the app. Shipping it Report-Only lets the
# operator load staging with devtools open, watch for violations, fix any, then
# promote each directive into the enforced header. See
# docs/history/2026-08-25-prerelease-audit.md H1 and operations/CSP_ROLLOUT.md.
# The four enforced directives are NOT repeated here: a browser ignores
# frame-ancestors in a report-only policy and WebKit says so in the console on
# every page load, and the enforced map is the one that counts for them.
# index.html carries no inline script (both pre-paint blocks live in
# /prepaint.js, lint:csp-no-inline-scripts), so script-src 'self' reports
# nothing on a clean build; e2e/csp-enforced.mjs loads the built app with this
# map ENFORCED and fails on any violation, which is what makes the promotion a
# one-line change.
# A RESPONSE THAT BRINGS ITS OWN POLICY KEEPS IT, and this is where nginx is
# told to stay out of its way. Two api responses do today:
#
#   - the sandbox door (GET /api/v1/try) draws a Cloudflare Turnstile, which
#     needs a third-party script, a frame of challenges.cloudflare.com, two
#     hosts to call home to, and a nonce for an inline script of ours
#     (api/src/routes/try-start-page.ts, startPolicy; #3434);
#   - a frame document (GET /api/v1/frame-docs/<ticket>) is a custom app block
#     or an installed renderer, inline script by nature, served with
#     `sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'`
#     (api/src/platform/frame-docs.ts; #3300).
#
# It has to be an exemption rather than a widening of the app's policy, for two
# reasons. Widening would open those sources for every page of the product to
# serve one response. And TWO Content-Security-Policy headers are enforced as
# their INTERSECTION, not their union, so leaving the strict one on these
# responses blocks them however wide their own policy is.
#
# KEYED ON THE RESPONSE, NOT THE URL. The first version listed the door's URI,
# and the next response to bring its own policy (the frame documents) got
# nginx's headers stacked on top: seen on staging 2026-09-23 as a report-only
# violation inside every custom block, and a break of every custom app and
# renderer on the day script-src is enforced. A list of URIs is a second copy
# of which routes set a policy, and it drifts. `$upstream_http_content_security_policy`
# is what the api actually sent, so a route that sets a policy is exempt by
# setting it, and nothing else is: the SPA and static files have no upstream
# and keep the strict pair, and so does every api response that sends none.
#
# An EMPTY add_header value is skipped by nginx, which is what makes this work
# without a second location block (a location that declares its own add_header
# drops the whole inherited set, so the security headers would have to be
# re-typed there -- the drift this file's header warns about).
map $upstream_http_content_security_policy $cobblr_own_csp {
    # No policy of its own (every static file, most api responses): strict.
    ""      0;
    # The response set one: it is the whole policy for that document.
    default 1;
}
# `default` is the strict policy and the exemption is the named case, so an
# unexpected value of $cobblr_own_csp fails CLOSED (strict) rather than open.
map $cobblr_own_csp $cobblr_csp_enforce {
    default "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'";
    1       "";
}
map $cobblr_own_csp $cobblr_csp_report {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'";
    1       "";
}

server {
    listen 8080;
    server_name _;

    # Don't advertise the nginx version.
    server_tokens off;

    # Security headers for the SPA + static assets. helmet already sets these on
    # /api responses (Express), but the SPA HTML is served by nginx and would
    # otherwise go out bare. Mirrors helmet's defaults. CSP is set from the two
    # $cobblr_csp_* maps above (enforced-safe + report-only-strict).
    # `always` so they also apply to error responses. NB: add_header does not
    # inherit into a location that declares its own add_header — re-stated in
    # each location below.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy $cobblr_csp_enforce always;
    add_header Content-Security-Policy-Report-Only $cobblr_csp_report always;

    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-suspenders: issue relative redirects only. Behind a
    # port-mapped container nginx only knows its internal listen
    # port (8080); an absolute directory-redirect would leak that
    # port into the Location header and bounce the browser to
    # whatever else is on :8080.
    absolute_redirect off;

    # Gzip — the SPA bundle compresses ~3.5× on the wire. The vite
    # build emits .map files (debug) and .css alongside the .js
    # chunks; cover them all.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # API proxy — keep this above the SPA fallback so /api/* never
    # falls through to index.html.
    location /api/ {
        # File uploads (pattern PDFs, phone photos via the camera Upload
        # path) routinely run 2-10 MB — nginx's 1m default 413s them in
        # the BROWSER while direct-to-API scripts work, which is exactly
        # how it hid. The API enforces its own per-route limits.
        client_max_body_size 50m;
        proxy_pass http://api:4000;
        # AI-backed endpoints (the floor-plan describe seed, long identify
        # calls) legitimately run past nginx's 60s default — the seed's
        # placements draft hit exactly 60.0s → 504 (2026-07-10). 180s covers
        # a full generation plus the one repair retry.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $cobblr_forwarded_proto;
        # API can stream; don't buffer if we ever return SSE.
        proxy_buffering off;
    }

    # SPA fallback — every other path resolves to index.html so
    # client routing handles it. Note: no `$uri/` — directory
    # resolution would 301 an SPA route like /assets to /assets/
    # and (if a build dir of that name existed) serve the wrong
    # thing. The build output lives under /static/ to keep app
    # routes collision-free regardless.
    location / {
        # The SPA shell (index.html) must revalidate on every load. It carries
        # NO content hash, but it references the hashed /static/ chunks — so a
        # device that cached an old index.html keeps requesting stale (immutable,
        # never-refetched) chunk hashes and NEVER sees a new deploy until a manual
        # hard refresh. Without an explicit header, browsers apply heuristic
        # caching and hold the old shell for minutes-to-hours after a promote
        # (why a shipped fix "doesn't show up"). `no-cache` = the browser MAY
        # store it but MUST revalidate with the server every load (a cheap 304 via
        # etag/last-modified when unchanged), so a promote reaches every device on
        # its next navigation. Hashed /static/ assets stay `immutable` above.
        # add_header in a location drops the server-level set — re-state security.
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy $cobblr_csp_enforce always;
        add_header Content-Security-Policy-Report-Only $cobblr_csp_report always;
        try_files $uri /index.html;
    }

    # Long cache for hashed build assets. Vite's build.assetsDir is
    # set to "static" (not the default "assets") so it never
    # collides with the app's own /assets route.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-stated: a location with its own add_header drops the server-level set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy $cobblr_csp_enforce always;
        add_header Content-Security-Policy-Report-Only $cobblr_csp_report always;
        # A MISSING hashed asset (e.g. a chunk requested mid-deploy, before the
        # new container/CDN has it) must NOT be cached as a 404 — otherwise that
        # 404 sticks at Cloudflare + the browser (the asset is `immutable`, never
        # re-fetched) and the SPA is permanently blank until a hard refresh (the
        # cobblr.me blank-screen, 2026-06-18). Route misses to a no-store 404 so
        # the very next request re-fetches once the asset exists.
        try_files $uri @static_missing;
    }
    location @static_missing {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
}
