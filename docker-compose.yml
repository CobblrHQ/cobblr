# Local dev stack. Same shape we'll deploy to the prod host — nothing
# bind-mounts source, the images are the source of truth at runtime.
# Rebuild on every code change you want to actually exercise.
#
# Persistent state lives in ./data/<service>/ (bind mounts, never
# named volumes). One predictable tree per stack — restic / rsync
# both see it, "move to a new SSD" is one rsync away, and you can
# inspect rows without `docker volume inspect`.

services:
  db:
    # Custom image = postgres:17-alpine + pgvector (docker/db.Dockerfile).
    # Same base / major / libc as stock 17-alpine → drop-in for the existing
    # bind-mounted data dir; adds the `vector` type for the knowledge base's
    # semantic search (and pgvector-backed search generally). Dev builds it
    # locally on first `compose up`; prod pins the CI-built registry image
    # (deploy/docker-compose.prod.yml).
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobblr}
      POSTGRES_DB: ${POSTGRES_DB:-cobblr_meta}
    volumes:
      # PG18+ keeps its cluster in a versioned subdirectory
      # (/var/lib/postgresql/<major>/docker), so the mount is one level up.
      # That is also what lets the image pg_upgrade an older data dir in
      # place on boot — see docker/db-auto-upgrade.sh.
      - ./data/postgres:/var/lib/postgresql
    ports:
      # Exposed on the host so you can connect with psql / a GUI.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobblr} -d ${POSTGRES_DB:-cobblr_meta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Deploy label for the web's env indicator (navbar tint + chip).
      COBBLR_ENV: ${COBBLR_ENV:-development}
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://cobblr:cobblr@db:5432/cobblr_meta}
      SUPERUSER_DATABASE_URL: ${SUPERUSER_DATABASE_URL:-postgres://cobblr:cobblr@db:5432/postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-do-not-use-in-prod-must-be-overridden}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TENANT_CREDS_ENCRYPTION_KEY: ${TENANT_CREDS_ENCRYPTION_KEY:-dev-only-32-byte-key-replace-me!!}
      # Comma-separated list of platform-operator emails. Empty in
      # dev (no /super-admin/* access); set in prod .env per
      # docs/operations/PRODUCTION_DEPLOY.md §3.1.
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      # The operator's contact address for outbound third-party calls (see
      # packages/platform-contract/src/outbound-identity.ts). Falls back to the
      # first SUPERADMIN_EMAILS entry.
      COBBLR_OPERATOR_EMAIL: ${COBBLR_OPERATOR_EMAIL:-}
      # Backup destinations (docs/operations/google-drive-backup-setup.md).
      # All empty in dev. Google app (Path A) + broker (Path B) config.
      BACKUP_FS_ROOT: ${BACKUP_FS_ROOT:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      GOOGLE_OAUTH_AUTH_URL: ${GOOGLE_OAUTH_AUTH_URL:-}
      GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-}
      BACKUP_OAUTH_BROKER_URL: ${BACKUP_OAUTH_BROKER_URL:-}
      BACKUP_BROKER_SHARED_SECRET: ${BACKUP_BROKER_SHARED_SECRET:-}
      # CORS allowlist for the web origin in production. Empty in
      # dev = reflect-any-origin (preserves local-host UX).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Public signup gate. Default off in prod (POST /auth/signup
      # returns 403); flip via .env to open self-service signup.
      # Dev default: unset → falls back to NODE_ENV check (open in dev).
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-}
      # Self-serve "invite a friend to their own Cobblr" (owners minting
      # own-workspace signup invites). The uncontrolled-growth lever, so it's
      # OFF in prod by default (unset → NODE_ENV check). Set "true" to open it.
      COBBLR_SELF_SERVE_INVITES: ${COBBLR_SELF_SERVE_INVITES:-}
      # Box-level barcode resolver (one shared cache + provider chain for
      # every product on the host; see the box.s barcode-resolver service).
      # Empty = core-scan resolves directly as before.
      COBBLR_BARCODE_RESOLVER_URL: ${COBBLR_BARCODE_RESOLVER_URL:-}
      COBBLR_BARCODE_RESOLVER_TOKEN: ${COBBLR_BARCODE_RESOLVER_TOKEN:-}
      # Shared reference-catalog service (core-catalogs hosted mode — the box's
      # reference-catalogs service; docs/architecture/shared-reference-catalogs.md).
      # Empty = catalogs resolve from the tenant DB as before (self-host default).
      COBBLR_CATALOG_RESOLVER_URL: ${COBBLR_CATALOG_RESOLVER_URL:-}
      COBBLR_CATALOG_RESOLVER_TOKEN: ${COBBLR_CATALOG_RESOLVER_TOKEN:-}
      # Third-party barcode lookups (core-scan): master switch + per-provider
      # toggles + API keys — see docs/SELF_HOSTING.md → Privacy. All optional;
      # unset = sensible defaults (go-upc scraper OFF, upcitemdb/OpenFacts/web
      # search ON). Set COBBLR_SCAN_EXTERNAL_LOOKUPS=false for zero outbound
      # barcode calls.
      COBBLR_SCAN_EXTERNAL_LOOKUPS: ${COBBLR_SCAN_EXTERNAL_LOOKUPS:-}
      COBBLR_SCAN_GOUPC: ${COBBLR_SCAN_GOUPC:-}
      COBBLR_SCAN_GOUPC_API_KEY: ${COBBLR_SCAN_GOUPC_API_KEY:-}
      COBBLR_SCAN_UPCITEMDB: ${COBBLR_SCAN_UPCITEMDB:-}
      COBBLR_SCAN_UPCITEMDB_KEY: ${COBBLR_SCAN_UPCITEMDB_KEY:-}
      COBBLR_SCAN_OPENFACTS: ${COBBLR_SCAN_OPENFACTS:-}
      COBBLR_SCAN_WEBSEARCH: ${COBBLR_SCAN_WEBSEARCH:-}
      # Instance kill-switch for ALL built-in LLM features. Default
      # "true". Set "false" for a guaranteed no-outbound-LLM deploy —
      # platform().ai.invoke() then refuses every call and AI features
      # degrade gracefully. Operator's hard floor, above per-workspace
      # BYO-key config.
      COBBLR_AI_ENABLED: ${COBBLR_AI_ENABLED:-true}
      # ── settings the schema accepted but compose never carried ──────────
      # env.ts read all of these and none of them arrived: this map is
      # explicit, so a variable it does not list is absent however carefully
      # it was set in .env. The trial guards are the sharp end — a try
      # instance would have booted with COBBLR_TIER unset and every guard
      # off, which looks exactly like a working deploy.
      # lint:env-reaches-container now holds this list to api/src/env.ts.
      COBBLR_TIER: ${COBBLR_TIER:-}
      TRY_TTL_DAYS: ${TRY_TTL_DAYS:-}
      COBBLR_TRIAL_REAP_WARN_DAYS: ${COBBLR_TRIAL_REAP_WARN_DAYS:-}
      COBBLR_TRIAL_DENY_MODULES: ${COBBLR_TRIAL_DENY_MODULES:-}
      # Signup gates: captcha (the site key is public and served at runtime
      # via /auth/config, so the shared web image bakes in no key),
      # disposable-address blocking, and verify-before-login.
      COBBLR_CAPTCHA_PROVIDER: ${COBBLR_CAPTCHA_PROVIDER:-}
      COBBLR_CAPTCHA_SECRET: ${COBBLR_CAPTCHA_SECRET:-}
      COBBLR_CAPTCHA_SITE_KEY: ${COBBLR_CAPTCHA_SITE_KEY:-}
      COBBLR_BLOCK_DISPOSABLE_EMAILS: ${COBBLR_BLOCK_DISPOSABLE_EMAILS:-}
      COBBLR_REQUIRE_EMAIL_VERIFY: ${COBBLR_REQUIRE_EMAIL_VERIFY:-}
      # Central identity. Unset = off, and this surface signs people in with
      # its own local passwords exactly as before.
      #   IDENTITY_URL                 the account service, e.g. http://<host>:8790
      #   IDENTITY_DEPLOYMENT_SECRET   this surface's half of the sign-in hand-off
      #   COBBLR_DEPLOYMENT            its name there (falls back to COBBLR_ENV)
      # See docs/architecture/central-identity.md.
      IDENTITY_URL: ${IDENTITY_URL:-}
      IDENTITY_PUBLIC_URL: ${IDENTITY_PUBLIC_URL:-}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-}
      IDENTITY_AUDIENCE: ${IDENTITY_AUDIENCE:-}
      IDENTITY_ADMIN_TOKEN: ${IDENTITY_ADMIN_TOKEN:-}
      IDENTITY_DEPLOYMENT_SECRET: ${IDENTITY_DEPLOYMENT_SECRET:-}
      # What the sign-in button calls the account service. Defaults to "Cobblr";
      # set it when federating with your own.
      IDENTITY_NAME: ${IDENTITY_NAME:-}
      COBBLR_DEPLOYMENT: ${COBBLR_DEPLOYMENT:-}
      # A PUBLIC demo's shared login, shown on and pre-filled into the sign-in
      # form. Setting the pair PUBLISHES that password to anyone who loads the
      # page: right for a demo that wipes itself on a timer, catastrophic
      # anywhere else. Both are required or the whole block is withheld.
      COBBLR_DEMO_SIGNIN_EMAIL: ${COBBLR_DEMO_SIGNIN_EMAIL:-}
      COBBLR_DEMO_SIGNIN_PASSWORD: ${COBBLR_DEMO_SIGNIN_PASSWORD:-}
      COBBLR_DEMO_SIGNIN_NOTE: ${COBBLR_DEMO_SIGNIN_NOTE:-}
      # "true" gives a central account with no workspace here one on arrival.
      # What an open trial surface wants; what a private one must never do.
      COBBLR_IDENTITY_AUTOPROVISION: ${COBBLR_IDENTITY_AUTOPROVISION:-}
      # Daily caps on new accounts, per source address and instance-wide. Read
      # through a helper that takes the NAME AS A STRING, so no schema parse and
      # no process.env scan could see them: they were missing here while the
      # docs told an operator to set them, which on an open signup page is the
      # brake silently not connected. lint:env-reaches-container now checks the
      # documented names too.
      COBBLR_SIGNUP_MAX_PER_IP_PER_DAY: ${COBBLR_SIGNUP_MAX_PER_IP_PER_DAY:-}
      COBBLR_SIGNUP_MAX_PER_DAY: ${COBBLR_SIGNUP_MAX_PER_DAY:-}
      COBBLR_RATELIMIT: ${COBBLR_RATELIMIT:-}
      # Marks this instance as hosted: strict egress + hosted defaults.
      COBBLR_HOSTED: ${COBBLR_HOSTED:-}
      # Sandbox pool + CPU quota tuning. Documented for years under names the
      # code does not read, and absent here besides.
      SANDBOX_WORKER_POOL_MAX: ${SANDBOX_WORKER_POOL_MAX:-}
      SANDBOX_WORKER_IDLE_MS: ${SANDBOX_WORKER_IDLE_MS:-}
      SANDBOX_DEFAULT_DEADLINE_MS: ${SANDBOX_DEFAULT_DEADLINE_MS:-}
      SANDBOX_CPU_WINDOW_MS: ${SANDBOX_CPU_WINDOW_MS:-}
      SANDBOX_CPU_QUOTA_MS_PER_WINDOW: ${SANDBOX_CPU_QUOTA_MS_PER_WINDOW:-}
      # This instance's own address, and the Discord sign-in app.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      # Community links offered in the account menu + Send Feedback. The
      # COBBLR_-prefixed invite wins over the bare name above when both are set.
      COBBLR_DISCORD_INVITE_URL: ${COBBLR_DISCORD_INVITE_URL:-}
      COBBLR_FORUM_URL: ${COBBLR_FORUM_URL:-}
      COBBLR_DOCS_URL: ${COBBLR_DOCS_URL:-}
      COBBLR_ISSUES_URL: ${COBBLR_ISSUES_URL:-}
      # A second instance sharing this Postgres (the canary channel): the
      # peer's DSN, so each side can notice a migration the other lacks.
      COBBLR_SHARED_DB_PEER: ${COBBLR_SHARED_DB_PEER:-}
      # Bound the activity log on a public host; unset keeps every row.
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-}
      COBBLR_DISABLE_EXPERIMENTAL_MODULES: ${COBBLR_DISABLE_EXPERIMENTAL_MODULES:-}
      # Marketplace v0.3.x runtime install — sandboxed module
      # tarballs go here. Bind-mounted so installs persist across
      # api restarts AND survive image rebuilds.
      COBBLR_RUNTIME_MODULES_DIR: /var/cobblr/sandboxed-modules
      # User-uploaded files (core-files). Bind-mounted to ./data/files
      # so they survive image rebuilds.
      COBBLR_FILES_ROOT: /var/cobblr/files
      # Optional: registry URL for /sandbox/install. Defaults to the PUBLIC
      # CobblrHQ/registry modules.json (raw URL, no token) — set this only to
      # point at an index of your own.
      COBBLR_REGISTRY_URL: ${COBBLR_REGISTRY_URL:-}
      # Needed ONLY when the URL above (or COBBLR_EXTENSIONS_URL) points at a
      # PRIVATE index; it is sent as a bearer token. The official catalogs need
      # no credential.
      COBBLR_REGISTRY_TOKEN: ${COBBLR_REGISTRY_TOKEN:-}
      # Shared barcode intelligence. Unset = the tier is inert (ships dark), so
      # this passthrough is a no-op until the service exists and an operator sets
      # a URL. Declared now because the dev compose enumerates env explicitly:
      # without the line, setting it in .env would silently do nothing here.
      COBBLR_BIDB_URL: ${COBBLR_BIDB_URL:-}
      COBBLR_BIDB_KEY: ${COBBLR_BIDB_KEY:-}
      # Carrier credentials for following a parcel. Same reason as above: this
      # compose enumerates env, so an unlisted var set in .env reaches nothing.
      COBBLR_FEDEX_API_KEY: ${COBBLR_FEDEX_API_KEY:-}
      COBBLR_FEDEX_SECRET_KEY: ${COBBLR_FEDEX_SECRET_KEY:-}
      COBBLR_FEDEX_ENV: ${COBBLR_FEDEX_ENV:-}
      COBBLR_TRACKING_API: ${COBBLR_TRACKING_API:-}
      COBBLR_TRACKING_API_URL: ${COBBLR_TRACKING_API_URL:-}
      COBBLR_TRACKING_API_KEY: ${COBBLR_TRACKING_API_KEY:-}
      COBBLR_TRACKING_API_TRANSIT: ${COBBLR_TRACKING_API_TRANSIT:-}

      COBBLR_TRACKING_POLL_INTERVAL: ${COBBLR_TRACKING_POLL_INTERVAL:-}
      # The companion Discord bot's base URL, if one is running. Offered in
      # .env.example and read by the app, so it has to be passed in here too.
      COBBLR_DISCORD_BOT_URL: ${COBBLR_DISCORD_BOT_URL:-}
      # Extension registry (the marketplace index). SELF-HOSTED by default:
      # the app builds the official catalog in-process from its baked-in bundle
      # manifests and serves it at GET /api/v1/registry/index.json — no GitHub,
      # always current with the deploy. Set this ONLY to override with an
      # external index.json (e.g. another cobblr.me's /api/v1/registry/
      # index.json, or a signed index). Empty/unset → local build.
      COBBLR_EXTENSIONS_URL: ${COBBLR_EXTENSIONS_URL:-}
      COBBLR_EXTENSIONS_SIG_URL: ${COBBLR_EXTENSIONS_SIG_URL:-}
      # Notarised-open trust anchor (Phase D): the PUBLIC ed25519 root key
      # (base64 SPKI). When set, the proxy verifies the official index's
      # detached signature + only then trusts its `trusted_keys`. Generate
      # with `node scripts/keygen-root.mjs`; keep the PRIVATE key secret.
      COBBLR_ROOT_PUBKEY: ${COBBLR_ROOT_PUBKEY:-}
      # Local dev/test only: let webhooks target host.docker.internal /
      # loopback (the e2e webhook mock runs on the host). MUST stay unset
      # in production — the webhook SSRF guard relies on it being off.
      COBBLR_WEBHOOK_ALLOW_INTERNAL: ${COBBLR_WEBHOOK_ALLOW_INTERNAL:-1}
      # Auth email (BYO, optional) — magic-link + signup-invite delivery. Pick
      # ONE provider via COBBLR_AUTH_EMAIL_PROVIDER (default smtp); unset = no
      # sender (dev-link / copy-link fallback). See auth-email-config.ts +
      # docs/operations/PRODUCTION_DEPLOY.md. (Cloud uses the overlay's managed
      # sender instead.) Empty-string is treated as unset (CLAUDE.md §14.6).
      COBBLR_AUTH_EMAIL_PROVIDER: ${COBBLR_AUTH_EMAIL_PROVIDER:-}
      COBBLR_AUTH_EMAIL_FROM: ${COBBLR_AUTH_EMAIL_FROM:-}
      COBBLR_AUTH_SMTP_HOST: ${COBBLR_AUTH_SMTP_HOST:-}
      COBBLR_AUTH_SMTP_PORT: ${COBBLR_AUTH_SMTP_PORT:-}
      COBBLR_AUTH_SMTP_USER: ${COBBLR_AUTH_SMTP_USER:-}
      COBBLR_AUTH_SMTP_PASS: ${COBBLR_AUTH_SMTP_PASS:-}
      COBBLR_AUTH_SMTP_SECURE: ${COBBLR_AUTH_SMTP_SECURE:-}
      COBBLR_AUTH_MAILGUN_API_KEY: ${COBBLR_AUTH_MAILGUN_API_KEY:-}
      COBBLR_AUTH_MAILGUN_DOMAIN: ${COBBLR_AUTH_MAILGUN_DOMAIN:-}
      COBBLR_AUTH_MAILGUN_EU: ${COBBLR_AUTH_MAILGUN_EU:-}
      COBBLR_AUTH_RESEND_API_KEY: ${COBBLR_AUTH_RESEND_API_KEY:-}
      COBBLR_AUTH_POSTMARK_TOKEN: ${COBBLR_AUTH_POSTMARK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Expose for local-dev curl/postman; in prod only the web
      # container reaches it.
      - "4000:4000"
    volumes:
      - ./data/sandboxed-modules:/var/cobblr/sandboxed-modules
      - ./data/files:/var/cobblr/files
    restart: unless-stopped
    labels:
      # Watchtower (on the prod host) only touches services with this
      # label — db stays pinned, api gets rolled forward automatically.
      com.centurylinklabs.watchtower.enable: "true"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      # Local dev defaults to 8088 to leave 8080 free for other
      # stacks on the same host. Prod compose can override via WEB_PORT.
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
