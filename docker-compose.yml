# Local dev stack. Same shape we'll deploy to the prod host — nothing
# bind-mounts source, the images are the source of truth at runtime.
# Rebuild on every code change you want to actually exercise.
#
# Persistent state lives in ./data/<service>/ (bind mounts, never
# named volumes). One predictable tree per stack — restic / rsync
# both see it, "move to a new SSD" is one rsync away, and you can
# inspect rows without `docker volume inspect`.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobblr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobblr}
      POSTGRES_DB: ${POSTGRES_DB:-cobblr_meta}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Exposed on the host so you can connect with psql / a GUI.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobblr} -d ${POSTGRES_DB:-cobblr_meta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://cobblr:cobblr@db:5432/cobblr_meta}
      SUPERUSER_DATABASE_URL: ${SUPERUSER_DATABASE_URL:-postgres://cobblr:cobblr@db:5432/postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-do-not-use-in-prod-must-be-overridden}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      TENANT_CREDS_ENCRYPTION_KEY: ${TENANT_CREDS_ENCRYPTION_KEY:-dev-only-32-byte-key-replace-me!!}
      # Comma-separated list of platform-operator emails. Empty in
      # dev (no /super-admin/* access); set in prod .env per
      # docs/PRODUCTION_DEPLOY.md §3.1.
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      # CORS allowlist for the web origin in production. Empty in
      # dev = reflect-any-origin (preserves local-host UX).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Public signup gate. Default off in prod (POST /auth/signup
      # returns 403); flip via .env to open self-service signup.
      # Dev default: unset → falls back to NODE_ENV check (open in dev).
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-}
      # Marketplace v0.3.x runtime install — sandboxed module
      # tarballs go here. Bind-mounted so installs persist across
      # api restarts AND survive image rebuilds.
      COBBLR_RUNTIME_MODULES_DIR: /var/cobblr/sandboxed-modules
      # User-uploaded files (core-files). Bind-mounted to ./data/files
      # so they survive image rebuilds.
      COBBLR_FILES_ROOT: /var/cobblr/files
      # Optional: registry URL + auth token for /sandbox/install.
      # Defaults to cobblrhq/registry's modules.json on GitHub.
      COBBLR_REGISTRY_URL: ${COBBLR_REGISTRY_URL:-}
      COBBLR_REGISTRY_TOKEN: ${COBBLR_REGISTRY_TOKEN:-}
      # Local dev/test only: let webhooks target host.docker.internal /
      # loopback (the e2e webhook mock runs on the host). MUST stay unset
      # in production — the webhook SSRF guard relies on it being off.
      COBBLR_WEBHOOK_ALLOW_INTERNAL: ${COBBLR_WEBHOOK_ALLOW_INTERNAL:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Expose for local-dev curl/postman; in prod only the web
      # container reaches it.
      - "4000:4000"
    volumes:
      - ./data/sandboxed-modules:/var/cobblr/sandboxed-modules
      - ./data/files:/var/cobblr/files
    restart: unless-stopped
    labels:
      # Watchtower (on the prod host) only touches services with this
      # label — db stays pinned, api gets rolled forward automatically.
      com.centurylinklabs.watchtower.enable: "true"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      # Local dev defaults to 8088 to leave 8080 free for other
      # stacks on the same host. Prod compose can override via WEB_PORT.
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
