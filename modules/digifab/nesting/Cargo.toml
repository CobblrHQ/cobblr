[package]
name = "cobblr-nesting"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jagua-rs = "=1.0.0"
sparrow = { git = "https://github.com/JeroenGar/sparrow", rev = "5901a79b6c5a74d8b9c356ee2916736567308108" }
wasm-bindgen = "=0.2.105"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rand = "=0.10.0"

[profile.release]
opt-level = 3
lto = true
